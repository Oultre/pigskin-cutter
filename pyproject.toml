[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pigskin-cutter"
version = "0.2.2"
description = "Pigskin Cutter: local-only football film cut-up tool: index film, filter plays, export clips."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Matt" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
cutup = "cutup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cutup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # the FastAPI TestClient's httpx usage is deprecated upstream; not our code
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:DeprecationWarning",
]

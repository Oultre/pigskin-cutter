name: Build & release

# Tag a commit `vX.Y.Z` (or run manually) to build unsigned one-file apps for
# macOS, Windows, and Linux and attach them to a GitHub Release (PLAN §3.6).
# macOS builds must run on macOS and Windows on Windows — GitHub gives us all
# three runners, so a single tag produces every artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: PigskinCutter-linux
          - os: windows-latest
            asset: PigskinCutter-windows.exe
          - os: macos-latest
            asset: PigskinCutter-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }        # the test fixtures use LFS

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # 1. build the React frontend into cutup/web/static
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      # 2. bundle a static ffmpeg so coaches don't have to install one.
      #    These are GPL static builds — fine for non-commercial use (PLAN §8).
      #    Update the URLs if a source moves.
      - name: Bundle ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src/cutup/bin/linux
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ff.tar.xz
          tar xf ff.tar.xz --strip-components=1 -C src/cutup/bin/linux --wildcards '*/ffmpeg' '*/ffprobe'
      - name: Bundle ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src/cutup/bin/darwin
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip && unzip -o ffmpeg.zip -d src/cutup/bin/darwin
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip && unzip -o ffprobe.zip -d src/cutup/bin/darwin
      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p src/cutup/bin/win32
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ff.zip
          unzip -o ff.zip -d fftmp
          cp fftmp/*/bin/ffmpeg.exe fftmp/*/bin/ffprobe.exe src/cutup/bin/win32/

      # 3. build the one-file app.
      #    pip install runs at the repo root (that's where pyproject.toml is);
      #    only the pyinstaller build runs inside packaging/ next to the spec.
      - name: Install package + PyInstaller
        run: python -m pip install -e . pyinstaller

      - name: Build one-file app
        run: pyinstaller pigskin-cutter.spec --noconfirm
        working-directory: packaging

      - name: Rename artifact
        shell: bash
        run: |
          cd packaging/dist
          bin=$(ls PigskinCutter* | head -1)
          mv "$bin" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packaging/dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Unsigned builds. First run: right-click → Open on macOS, or
            "More info → Run anyway" past SmartScreen on Windows. See docs/INSTALL.md.
